name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# push + pull_request on the same branch would double-run; key the group on
# the source branch name for both event types and keep only the newest run.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck on all Bash scripts
        run: |
          find . -name '*.sh' -not -path './.git/*' | while read -r script; do
            echo "Checking $script..."
            shellcheck -x -s bash "$script" || exit 1
          done

  bash-syntax:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax (bash -n)
        run: |
          find . -name '*.sh' -not -path './.git/*' | while read -r script; do
            echo "Syntax-checking $script..."
            bash -n "$script" || exit 1
          done

  bats-tests:
    name: Bats Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: |
          sudo apt-get install -y bats
      - name: Run Bats tests
        run: bats tests/*.bats

  python-lint:
    name: Python Lint (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Lint Python files
        run: flake8 gui/ --max-line-length=120 --ignore=E501,W503,E402

  python-syntax:
    name: Python Syntax Check (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every GUI module
        run: |
          set -e
          for f in $(find gui -name '*.py'); do
            echo "py_compile $f"
            python -m py_compile "$f"
          done

  python-unit:
    name: Python Unit Tests (validators + policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pure-Python unit tests (no dbus/gi needed)
        run: |
          set -e
          python tests/test_validate.py
          python tests/test_policy_actions.py

  gui-construct-smoke:
    name: GUI Construction Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 / libadwaita / PyGObject + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            libadwaita-1-0 xvfb
      - name: Construct every page + window headlessly under Xvfb
        run: xvfb-run -a python3 tests/test_gui_construct.py

  dbus-introspect-smoke:
    name: D-Bus Introspect Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install D-Bus runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus dbus-x11 python3-dbus python3-gi systemd
      - name: Boot a session bus, register the service, introspect
        run: |
          # The service runs against a private session bus so CI does not
          # need root or a real system bus. We only assert that the
          # service registers, exposes Ping, GetMonitoringData, and the
          # TelemetryUpdated/AudioEnhancementChanged signals.
          dbus-run-session -- bash tests/dbus_smoke.sh
