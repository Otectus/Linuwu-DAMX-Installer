<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the Archer service -->
  <policy user="root">
    <allow own="io.otectus.Archer1"/>
  </policy>

  <!-- Default-deny: callers may only reach the Archer interface and the
       standard D-Bus introspection/properties/peer interfaces on this service.
       polkit (checked inside the daemon) remains the authorization gate for all
       mutating methods; this just narrows the bus-level attack surface. -->
  <policy context="default">
    <deny send_destination="io.otectus.Archer1"/>
    <allow send_destination="io.otectus.Archer1"
           send_interface="io.otectus.Archer1"/>
    <allow send_destination="io.otectus.Archer1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.otectus.Archer1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.otectus.Archer1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow receive_sender="io.otectus.Archer1"/>
  </policy>
</busconfig>
